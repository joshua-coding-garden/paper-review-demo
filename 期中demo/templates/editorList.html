{% extends "base.html" %}
{% block title %}待審查清單{% endblock %}
{% block content %}
<h3>待審查清單</h3>
<table>
	<tr><th>作者</th><th>類別</th><th>標題</th></tr>
	{% for p in papers %}
	<tr>
		<td>{{ p.author }}</td>
		<td>{{ p.category }}</td>
		<td><a href="/editor/papers/{{ p.id }}">{{ p.title }}</a></td>
	</tr>
	{% else %}
	<tr><td colspan="3">目前沒有待審查的稿件</td></tr>
	{% endfor %}
</table>
{% endblock %}
